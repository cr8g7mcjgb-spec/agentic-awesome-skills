<title>Iso Extrude — isometric extruded type with motion ghosts</title>
<style>
  :root{--ui-bg:#101014;--ui-panel:#17171d;--ui-line:#2b2b34;--ui-fg:#e9e9ee;--ui-dim:#8a8a95;--ui-accent:#4a5cf5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ui-bg);color:var(--ui-fg);font:12px/1.5 ui-sans-serif,system-ui,"Liberation Sans",sans-serif}
  .app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
  @media (max-width:820px){.app{grid-template-columns:1fr}}
  .panel{background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:16px;
         display:flex;flex-direction:column;gap:13px;max-height:100vh;overflow:auto}
  .panel h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .panel h1 small{display:block;color:var(--ui-dim);letter-spacing:.03em;text-transform:none;font-weight:400;margin-top:4px}
  fieldset{border:1px solid var(--ui-line);border-radius:8px;padding:10px;margin:0}
  legend{color:var(--ui-dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px;padding:0 4px}
  label{display:grid;grid-template-columns:1fr 48px;align-items:center;gap:6px;margin:7px 0}
  label>span{color:var(--ui-dim)}
  label>output{color:var(--ui-accent);text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ui-accent);margin:0}
  input[type=color]{width:100%;height:26px;padding:0;border:1px solid var(--ui-line);border-radius:5px;background:none}
  textarea,select,input[type=text]{width:100%;background:#0c0c10;color:var(--ui-fg);border:1px solid var(--ui-line);
    border-radius:6px;padding:7px;font:inherit}
  textarea{resize:vertical;min-height:46px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{background:#212129;color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:6px;padding:8px 6px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
  button.primary{background:var(--ui-accent);color:#fff;border-color:var(--ui-accent);font-weight:700}
  .check{display:flex;align-items:center;gap:8px;margin:7px 0}
  .check input{accent-color:var(--ui-accent)}
  .stage{display:grid;place-items:center;padding:22px;
         background:repeating-conic-gradient(#151519 0 25%,#101014 0 50%) 0 0/24px 24px}
  .poster{width:min(80vh,100%);aspect-ratio:1080/1440;box-shadow:0 26px 70px #000a}
  svg{display:block;width:100%;height:100%}
  .hint{color:var(--ui-dim);margin:2px 0 6px}
</style>

<div class="app">
<aside class="panel">
  <h1>Iso Extrude<small>아이소메트릭 전단 + 압출 + 잔상. 같은 문구를 계단처럼 반복해 쌓습니다.</small></h1>

  <fieldset><legend>Preset</legend>
    <div class="presets">
      <button data-preset="never">NEVER GIVE UP</button>
      <button data-preset="nopain">NO PAIN NO GAIN</button>
      <button data-preset="acid">ACID GREEN</button>
      <button data-preset="mono">MONO NOIR</button>
    </div>
  </fieldset>

  <fieldset><legend>Text</legend>
    <textarea id="txt" spellcheck="false"></textarea>
    <label><span>글자 크기</span><output id="sizeO"></output>
      <input type="range" id="size" min="40" max="220" step="1"></label>
    <label><span>자간</span><output id="trO"></output>
      <input type="range" id="tr" min="-14" max="20" step="0.5"></label>
    <label><span>살 붙이기</span><output id="fatO"></output>
      <input type="range" id="fat" min="0" max="20" step="0.5"></label>
    <label><span>가로 눌림</span><output id="sxO"></output>
      <input type="range" id="sx" min="0.6" max="1.4" step="0.01"></label>
  </fieldset>

  <fieldset><legend>Isometry</legend>
    <p class="hint">기울기는 글줄이 흐르는 각도, 전단은 글자가 눕는 각도입니다.</p>
    <label><span>글줄 기울기</span><output id="tiltO"></output>
      <input type="range" id="tilt" min="-45" max="45" step="1"></label>
    <label><span>글자 전단</span><output id="skewO"></output>
      <input type="range" id="skew" min="-40" max="40" step="1"></label>
    <label><span>세로 눌림</span><output id="syO"></output>
      <input type="range" id="sy" min="0.55" max="1.2" step="0.01"></label>
  </fieldset>

  <fieldset><legend>Extrusion</legend>
    <label><span>깊이</span><output id="depO"></output>
      <input type="range" id="dep" min="0" max="120" step="1"></label>
    <label><span>방향</span><output id="edirO"></output>
      <input type="range" id="edir" min="0" max="360" step="5"></label>
    <div class="row">
      <div><span style="color:var(--ui-dim)">앞면</span><input type="color" id="face"></div>
      <div><span style="color:var(--ui-dim)">옆면</span><input type="color" id="side"></div>
    </div>
  </fieldset>

  <fieldset><legend>Stack &amp; ghost</legend>
    <label><span>덩어리 수</span><output id="groupsO"></output>
      <input type="range" id="groups" min="1" max="5" step="1"></label>
    <label><span>덩어리 간격</span><output id="gapO"></output>
      <input type="range" id="gap" min="120" max="600" step="10"></label>
    <label><span>덩어리 가로 이동</span><output id="gdxO"></output>
      <input type="range" id="gdx" min="-320" max="320" step="10"></label>
    <label><span>줄 반복</span><output id="repO"></output>
      <input type="range" id="rep" min="1" max="5" step="1"></label>
    <label><span>줄 간격</span><output id="rstepO"></output>
      <input type="range" id="rstep" min="20" max="180" step="2"></label>
    <label><span>선명한 줄</span><output id="sharpO"></output>
      <input type="range" id="sharp" min="1" max="4" step="1"></label>
    <label><span>잔상 번짐</span><output id="ghostO"></output>
      <input type="range" id="ghost" min="0" max="26" step="0.5"></label>
    <label><span>잔상 농도</span><output id="gopO"></output>
      <input type="range" id="gop" min="0.05" max="1" step="0.02"></label>
  </fieldset>

  <fieldset><legend>Scene</legend>
    <div><span style="color:var(--ui-dim)">배경</span><input type="color" id="bg"></div>
    <label class="check" style="margin-top:8px"><input type="checkbox" id="guides"><span>점선 가이드</span></label>
    <label><span>가이드 간격</span><output id="gsO"></output>
      <input type="range" id="gs" min="120" max="700" step="10"></label>
    <label><span>그레인</span><output id="grainO"></output>
      <input type="range" id="grain" min="0" max="0.4" step="0.01"></label>
    <p class="hint" style="margin-top:10px">가장자리 라벨 — 한 줄에 <code>x,y,각도|글자</code></p>
    <textarea id="labels" spellcheck="false" style="min-height:78px"></textarea>
  </fieldset>

  <button class="primary" id="png">PNG 내보내기</button>
  <button id="svgdl">SVG 내보내기</button>
</aside>

<main class="stage">
  <div class="poster">
    <svg id="poster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440">
      <defs id="defs">
        <filter id="grainF" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
      </defs>
      <rect id="bgRect" width="1080" height="1440" fill="#e6e6e8"/>
      <g id="guideG"></g>
      <g id="typeG"></g>
      <g id="labelG"></g>
      <rect id="grainRect" width="1080" height="1440" filter="url(#grainF)"
            style="mix-blend-mode:multiply" opacity=".08"/>
    </svg>
  </div>
</main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1080, H = 1440;

const PRESETS = {
  /* 원본: 파란 "NEVER GIVE UP" 아이소메트릭 포스터 */
  never: {
    txt:"NEVER GIVE UP", size:104, tr:1, fat:5, sx:1,
    tilt:20, skew:-14, sy:0.92,
    dep:34, edir:250, face:"#2431d6", side:"#101a8c",
    groups:3, gap:400, gdx:-150, rep:3, rstep:74, sharp:2, ghost:11, gop:0.5,
    bg:"#e4e4e6", guides:true, gs:300, grain:0.06,
    labels:"58,600,-90|THREE STEPS TO TEACH YOU\n1044,700,90|AI MAKES TEXT PAGE TURN EFFECTS\n760,66,0|FONT DESIGN\n80,1330,20|2022-11-07"
  },
  /* 원본: 흰 배경 "NO PAIN NO GAIN" 변형 */
  nopain: {
    txt:"NO PAIN NO GAIN", size:86, tr:0.5, fat:4, sx:0.92,
    tilt:18, skew:-10, sy:0.9,
    dep:26, edir:255, face:"#2b3cf0", side:"#141d9e",
    groups:3, gap:380, gdx:-120, rep:2, rstep:64, sharp:2, ghost:6, gop:0.42,
    bg:"#ffffff", guides:true, gs:340, grain:0.04,
    labels:"70,90,0|NXT\n700,86,0|GRAPHIC DESIGN TUTORIAL\n300,600,18|DONT DWELL ON DREAMS AND IGNORE LIFE"
  },
  acid: {
    txt:"KEEP GOING", size:118, tr:2, fat:6, sx:1.05,
    tilt:-16, skew:12, sy:0.95,
    dep:44, edir:110, face:"#c8ff3c", side:"#4f6b0a",
    groups:2, gap:520, gdx:180, rep:4, rstep:88, sharp:1, ghost:16, gop:0.42,
    bg:"#0e0e10", guides:true, gs:260, grain:0.12,
    labels:"58,300,-90|SIDE A\n1044,1150,90|33 RPM"
  },
  mono: {
    txt:"NO SLEEP", size:130, tr:-2, fat:8, sx:1,
    tilt:24, skew:-18, sy:0.88,
    dep:56, edir:245, face:"#f2f2f2", side:"#6d6d72",
    groups:2, gap:560, gdx:-200, rep:2, rstep:96, sharp:2, ghost:14, gop:0.4,
    bg:"#141416", guides:false, gs:300, grain:0.14,
    labels:"58,420,-90|NIGHT SHIFT\n1044,1200,90|04:00"
  }
};

const CTRL = {
  txt:"value", size:"n", tr:"n", fat:"n", sx:"n",
  tilt:"n", skew:"n", sy:"n",
  dep:"n", edir:"n", face:"value", side:"value",
  groups:"n", gap:"n", gdx:"n", rep:"n", rstep:"n", sharp:"n", ghost:"n", gop:"n",
  bg:"value", guides:"checked", gs:"n", grain:"n", labels:"value"
};

const read = () => Object.fromEntries(Object.entries(CTRL).map(([k, kind]) => {
  const el = $(k);
  return [k, kind === "n" ? parseFloat(el.value) : kind === "checked" ? el.checked : el.value];
}));

function applyPreset(p){
  for (const [k, kind] of Object.entries(CTRL)){
    if (!(k in p)) continue;
    if (kind === "checked") $(k).checked = p[k]; else $(k).value = p[k];
  }
  render();
}

const FACE = "'Archivo Black','Arial Black',Impact,'Helvetica Now Display','Liberation Sans',sans-serif";

function mkText(str, s, fill){
  const t = document.createElementNS(SVGNS, "text");
  t.setAttribute("x", 0); t.setAttribute("y", 0);
  t.setAttribute("font-family", FACE);
  t.setAttribute("font-weight", "900");
  t.setAttribute("font-size", s.size);
  t.setAttribute("letter-spacing", s.tr);
  t.setAttribute("fill", fill);
  if (s.fat > 0){
    t.setAttribute("stroke", fill);
    t.setAttribute("stroke-width", s.fat);
    t.setAttribute("stroke-linejoin", "round");
    t.setAttribute("paint-order", "stroke fill");
  }
  t.textContent = str;
  return t;
}

/* 압출 = 같은 글자를 깊이 방향으로 1px 씩 밀어 겹겹이 쌓고,
   맨 앞에만 앞면 색을 올린다. 3D 소프트웨어 없이 입체가 되는 이유. */
function extruded(str, s){
  const g = document.createElementNS(SVGNS, "g");
  const a = s.edir * Math.PI / 180;
  const dx = Math.cos(a), dy = Math.sin(a);
  const steps = Math.round(s.dep);
  for (let i = steps; i >= 1; i--){
    const t = mkText(str, s, s.side);
    t.setAttribute("transform", `translate(${(dx*i).toFixed(2)} ${(dy*i).toFixed(2)})`);
    g.appendChild(t);
  }
  g.appendChild(mkText(str, s, s.face));
  return g;
}

function buildType(s){
  const host = $("typeG");
  host.textContent = "";
  const defs = $("defs");
  // 이전에 만든 블러 필터 정리
  [...defs.querySelectorAll("filter[id^='gb']")].forEach(n => n.remove());

  const blurIds = [];
  for (let i = 1; i <= 5; i++){
    const sd = s.ghost * i;
    const f = document.createElementNS(SVGNS, "filter");
    f.setAttribute("id", "gb" + i);
    f.setAttribute("x", "-30%"); f.setAttribute("y", "-30%");
    f.setAttribute("width", "160%"); f.setAttribute("height", "160%");
    const b = document.createElementNS(SVGNS, "feGaussianBlur");
    b.setAttribute("stdDeviation", sd);
    f.appendChild(b);
    defs.appendChild(f);
    blurIds.push("gb" + i);
  }

  const totalH = (s.groups - 1) * s.gap;
  const startY = (H - totalH) / 2;

  for (let gi = 0; gi < s.groups; gi++){
    const gx = W / 2 + (gi - (s.groups - 1) / 2) * s.gdx;
    const gy = startY + gi * s.gap;

    const outer = document.createElementNS(SVGNS, "g");
    const grp = document.createElementNS(SVGNS, "g");
    // 글줄 기울기 → 글자 전단 → 폭·높이 눌림. 순서가 바뀌면 각이 달라진다.
    grp.setAttribute("transform",
      `rotate(${s.tilt}) skewX(${s.skew}) scale(${s.sx} ${s.sy})`);
    outer.appendChild(grp);

    // 뒤에서 앞으로: 흐린 잔상부터 깔고 선명한 줄을 위에 얹는다
    for (let r = s.rep - 1; r >= 0; r--){
      const y = r * s.rstep;
      const isSharp = r < s.sharp;
      const line = document.createElementNS(SVGNS, "g");
      line.setAttribute("transform", `translate(0 ${y})`);

      const body = isSharp ? extruded(s.txt, s) : mkText(s.txt, s, s.face);
      if (!isSharp){
        const k = Math.min(5, r - s.sharp + 1);
        if (s.ghost > 0) line.setAttribute("filter", `url(#${blurIds[k-1]})`);
        line.setAttribute("opacity", Math.max(0.04, s.gop / k));
      }
      line.appendChild(body);
      grp.appendChild(line);
    }

    // 기울인 뒤의 실제 크기를 재서 화면 밖으로 나가지 않게 맞춘다.
    // 부모 g 의 getBBox 는 자식 transform 이 적용된 결과를 돌려준다.
    host.appendChild(outer);
    const bb = outer.getBBox();
    const pad = 40;
    const k = bb.width > 0 ? Math.min(1, (W - pad*2) / bb.width) : 1;
    outer.setAttribute("transform",
      `translate(${(gx - k*(bb.x + bb.width/2)).toFixed(2)} ${(gy - k*(bb.y + bb.height/2)).toFixed(2)}) scale(${k.toFixed(4)})`);
  }
}

function buildGuides(s){
  const g = $("guideG");
  g.textContent = "";
  if (!s.guides) return;
  g.setAttribute("stroke", s.face);
  g.setAttribute("stroke-width", "1.6");
  g.setAttribute("stroke-dasharray", "12 10");
  g.setAttribute("opacity", ".55");
  g.setAttribute("fill", "none");
  // 본문과 같은 각, 그리고 그 거울각으로 아이소메트릭 격자를 만든다
  for (const ang of [s.tilt, -s.tilt]){
    const a = ang * Math.PI / 180;
    const dx = Math.cos(a), dy = Math.sin(a);
    const nx = -dy, ny = dx;
    const span = Math.hypot(W, H);
    for (let k = -Math.ceil(span / s.gs); k <= Math.ceil(span / s.gs); k++){
      const ox = W/2 + nx * k * s.gs, oy = H/2 + ny * k * s.gs;
      const p = document.createElementNS(SVGNS, "path");
      p.setAttribute("d",
        `M${(ox - dx*span).toFixed(1)} ${(oy - dy*span).toFixed(1)}L${(ox + dx*span).toFixed(1)} ${(oy + dy*span).toFixed(1)}`);
      g.appendChild(p);
    }
  }
}

function buildLabels(s){
  const g = $("labelG");
  g.textContent = "";
  for (const raw of s.labels.split("\n")){
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*\|(.*)$/);
    if (!m) continue;
    const [, x, y, rot, body] = m;
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("transform", `translate(${x} ${y}) rotate(${rot})`);
    t.setAttribute("font-size", 19);
    t.setAttribute("font-weight", 800);
    t.setAttribute("letter-spacing", 1.4);
    t.setAttribute("font-family", "ui-sans-serif,system-ui,'Liberation Sans',sans-serif");
    t.setAttribute("fill", s.face);
    t.textContent = body.trim();
    g.appendChild(t);
  }
}

function render(){
  const s = read();
  for (const k of Object.keys(CTRL))
    if (CTRL[k] === "n" && $(k + "O")) $(k + "O").value = s[k];

  $("bgRect").setAttribute("fill", s.bg);
  buildGuides(s);
  buildType(s);
  buildLabels(s);
  $("grainRect").setAttribute("opacity", s.grain);
}

function serialize(){
  const svg = $("poster").cloneNode(true);
  svg.setAttribute("xmlns", SVGNS);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
}
const dataURL = () => "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(serialize())));
function download(href, name){ const a = document.createElement("a"); a.href = href; a.download = name; a.click(); }
$("png").onclick = () => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = W * 2; c.height = H * 2;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    download(c.toDataURL("image/png"), "iso-extrude.png");
  };
  img.onerror = () => alert("내보내기 실패");
  img.src = dataURL();
};
$("svgdl").onclick = () => download(dataURL(), "iso-extrude.svg");

document.querySelectorAll(".presets button").forEach(b =>
  b.onclick = () => applyPreset(PRESETS[b.dataset.preset]));
for (const key of Object.keys(CTRL)) $(key).addEventListener("input", render);
applyPreset(PRESETS.never);
</script>
