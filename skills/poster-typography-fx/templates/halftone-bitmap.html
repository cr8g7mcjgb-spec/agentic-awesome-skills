<title>Halftone Bitmap — Illustrator-style dot screen</title>
<style>
  :root{--ui-bg:#111114;--ui-panel:#18181d;--ui-line:#2c2c34;--ui-fg:#e8e8ec;--ui-dim:#8b8b96;--ui-accent:#ff9ec7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ui-bg);color:var(--ui-fg);font:12px/1.5 ui-sans-serif,system-ui,"Liberation Sans",sans-serif}
  .app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
  @media (max-width:820px){.app{grid-template-columns:1fr}}
  .panel{background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:16px;
         display:flex;flex-direction:column;gap:14px;max-height:100vh;overflow:auto}
  .panel h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .panel h1 small{display:block;color:var(--ui-dim);letter-spacing:.04em;text-transform:none;font-weight:400;margin-top:4px}
  fieldset{border:1px solid var(--ui-line);border-radius:8px;padding:10px;margin:0}
  legend{color:var(--ui-dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px;padding:0 4px}
  label{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:6px;margin:7px 0}
  label>span{color:var(--ui-dim)}
  label>output{color:var(--ui-accent);text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ui-accent);margin:0}
  input[type=color]{width:100%;height:26px;padding:0;border:1px solid var(--ui-line);border-radius:5px;background:none}
  textarea,select,input[type=text]{width:100%;background:#0e0e12;color:var(--ui-fg);border:1px solid var(--ui-line);
    border-radius:6px;padding:7px;font:inherit}
  textarea{resize:vertical;min-height:52px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{background:#22222a;color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:6px;padding:8px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
  button.primary{background:var(--ui-accent);color:#111;border-color:var(--ui-accent);font-weight:700}
  .check{display:flex;align-items:center;gap:8px;margin:7px 0}
  .check input{accent-color:var(--ui-accent)}
  .stage{display:grid;place-items:center;padding:24px;
         background:repeating-conic-gradient(#151519 0 25%,#101014 0 50%) 0 0/24px 24px}
  .poster{width:min(78vh,100%);aspect-ratio:1080/1350;box-shadow:0 24px 60px #0009}
  svg{display:block;width:100%;height:100%}
  .hint{color:var(--ui-dim);margin:2px 0 6px}
</style>

<div class="app">
<aside class="panel">
  <h1>Halftone Bitmap<small>일러스트레이터식 비트맵 하프톤 — 벡터 점으로 출력</small></h1>

  <fieldset><legend>Preset</legend>
    <div class="presets">
      <button data-preset="cherry">CHERRY (원본)</button>
      <button data-preset="apple">APPLE (모양만 교체)</button>
      <button data-preset="mono">MONO NOIR</button>
      <button data-preset="risoblue">RISO BLUE</button>
    </div>
  </fieldset>

  <fieldset><legend>Shape</legend>
    <p class="hint">여기만 바꾸면 체리 → 사과. 나머지 질감은 그대로 유지됩니다.</p>
    <select id="shape">
      <option value="cherry">체리</option>
      <option value="apple">사과</option>
      <option value="pear">배</option>
      <option value="heart">하트</option>
      <option value="star">별</option>
      <option value="flower">꽃</option>
      <option value="blob">블롭</option>
      <option value="none">없음</option>
    </select>
    <label style="margin-top:8px"><span>크기</span><output id="shsizeO"></output>
      <input type="range" id="shsize" min="200" max="900" step="10"></label>
    <label><span>위치 X</span><output id="shxO"></output>
      <input type="range" id="shx" min="0" max="1080" step="10"></label>
    <label><span>위치 Y</span><output id="shyO"></output>
      <input type="range" id="shy" min="0" max="1350" step="10"></label>
    <label><span>회전</span><output id="shrotO"></output>
      <input type="range" id="shrot" min="-45" max="45" step="1"></label>
    <label><span>하이라이트 위치</span><output id="hlO"></output>
      <input type="range" id="hl" min="0" max="1" step="0.02"></label>
    <label><span>입체감</span><output id="volO"></output>
      <input type="range" id="vol" min="0" max="1" step="0.02"></label>
  </fieldset>

  <fieldset><legend>Halftone screen</legend>
    <label><span>점 간격</span><output id="cellO"></output>
      <input type="range" id="cell" min="5" max="34" step="1"></label>
    <label><span>스크린 각도</span><output id="angO"></output>
      <input type="range" id="ang" min="0" max="90" step="1"></label>
    <label><span>점 크기</span><output id="dotO"></output>
      <input type="range" id="dot" min="0.4" max="1.8" step="0.02"></label>
    <label><span>대비</span><output id="conO"></output>
      <input type="range" id="con" min="0.3" max="3" step="0.05"></label>
    <select id="dshape" style="margin-top:6px">
      <option value="circle">원형 점</option>
      <option value="square">사각 점</option>
      <option value="diamond">마름모 점</option>
    </select>
    <label class="check"><input type="checkbox" id="inv"><span>반전</span></label>
  </fieldset>

  <fieldset><legend>Type</legend>
    <textarea id="txt" spellcheck="false"></textarea>
    <label><span>크기</span><output id="tsizeO"></output>
      <input type="range" id="tsize" min="40" max="260" step="2"></label>
    <label><span>줄 간격</span><output id="tlhO"></output>
      <input type="range" id="tlh" min="0.7" max="1.5" step="0.02"></label>
    <label><span>위치 Y</span><output id="tyO"></output>
      <input type="range" id="ty" min="0" max="1350" step="10"></label>
    <label><span>글자 농도</span><output id="tdenO"></output>
      <input type="range" id="tden" min="0.3" max="1" step="0.02"></label>
    <label class="check"><input type="checkbox" id="tgrad"><span>글자에 그라디언트</span></label>
    <input type="text" id="sub" spellcheck="false" placeholder="부제 (하프톤 아님)" style="margin-top:6px">
  </fieldset>

  <fieldset><legend>Colour</legend>
    <div class="row">
      <div><span style="color:var(--ui-dim)">배경</span><input type="color" id="bg"></div>
      <div><span style="color:var(--ui-dim)">점</span><input type="color" id="ink"></div>
    </div>
  </fieldset>

  <button class="primary" id="png">PNG 내보내기</button>
  <button id="svgdl">SVG 내보내기 (벡터 점)</button>
</aside>

<main class="stage">
  <div class="poster">
    <svg id="poster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350">
      <rect id="bgRect" width="1080" height="1350" fill="#ff9ec7"/>
      <path id="dots" fill="#111111"/>
      <g id="copy"></g>
    </svg>
  </div>
</main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1080, H = 1350;

/* ---------------------------------------------------------------
   도형 정의. 모두 100×100 좌표계 기준.
   fill:true 는 면, w:n 은 굵기 n 의 선.
   여기에 항목만 추가하면 새 모양이 그대로 하프톤으로 나온다.
----------------------------------------------------------------*/
const SHAPES = {
  cherry: [
    { d:"M54 20 C 42 38, 32 52, 30 62", w:4 },
    { d:"M54 20 C 62 42, 66 56, 67 66", w:4 },
    { d:"M54 20 C 66 6, 84 6, 92 12 C 82 24, 64 28, 54 20 Z", fill:true },
    { d:"M30 62 m -20 0 a 20 20 0 1 0 40 0 a 20 20 0 1 0 -40 0", fill:true },
    { d:"M69 68 m -18 0 a 18 18 0 1 0 36 0 a 18 18 0 1 0 -36 0", fill:true }
  ],
  apple: [
    { d:"M50 30 C 40 16, 16 18, 12 40 C 8 62, 24 88, 38 93 C 44 95, 47 92, 50 92 C 53 92, 56 95, 62 93 C 76 88, 92 62, 88 40 C 84 18, 60 16, 50 30 Z", fill:true },
    { d:"M50 30 C 50 18, 53 10, 58 4", w:4 },
    { d:"M56 14 C 66 0, 84 0, 92 6 C 82 18, 64 22, 56 14 Z", fill:true }
  ],
  pear: [
    { d:"M50 34 C 38 34, 30 48, 32 60 C 34 74, 26 78, 26 88 C 26 96, 38 100, 50 100 C 62 100, 74 96, 74 88 C 74 78, 66 74, 68 60 C 70 48, 62 34, 50 34 Z", fill:true },
    { d:"M50 34 C 50 22, 52 12, 58 6", w:4 },
    { d:"M52 20 C 64 8, 80 8, 88 14 C 78 26, 60 28, 52 20 Z", fill:true }
  ],
  heart: [
    { d:"M50 92 C 8 62, 4 34, 22 22 C 36 12, 48 22, 50 32 C 52 22, 64 12, 78 22 C 96 34, 92 62, 50 92 Z", fill:true }
  ],
  star: [
    { d:"M50 4 L 62 36 L 96 38 L 70 60 L 78 94 L 50 74 L 22 94 L 30 60 L 4 38 L 38 36 Z", fill:true }
  ],
  flower: [
    { d:"M50 50 m -16 0 a 16 16 0 1 0 32 0 a 16 16 0 1 0 -32 0", fill:true },
    { d:"M50 6 C 66 6, 74 20, 62 36 C 56 44, 44 44, 38 36 C 26 20, 34 6, 50 6 Z", fill:true },
    { d:"M50 94 C 34 94, 26 80, 38 64 C 44 56, 56 56, 62 64 C 74 80, 66 94, 50 94 Z", fill:true },
    { d:"M6 50 C 6 34, 20 26, 36 38 C 44 44, 44 56, 36 62 C 20 74, 6 66, 6 50 Z", fill:true },
    { d:"M94 50 C 94 66, 80 74, 64 62 C 56 56, 56 44, 64 38 C 80 26, 94 34, 94 50 Z", fill:true }
  ],
  blob: [
    { d:"M50 6 C 78 6, 96 26, 94 50 C 92 76, 74 96, 48 94 C 24 92, 6 74, 6 48 C 6 24, 24 6, 50 6 Z", fill:true }
  ],
  none: []
};

const PRESETS = {
  /* 원본 5: 핑크 배경 + 체리 + "bitmap effect" */
  cherry: {
    shape:"cherry", shsize:520, shx:540, shy:930, shrot:0, hl:0.35, vol:0.75,
    cell:11, ang:45, dot:1.05, con:1.2, dshape:"circle", inv:false,
    txt:"bitmap\neffect", tsize:210, tlh:0.92, ty:330, tden:0.92, tgrad:false,
    sub:"BITMAP HALF TONES IN AI",
    bg:"#ff9ec7", ink:"#111111"
  },
  /* 같은 질감, 모양만 사과로 — 사용자가 요청한 교체 예시 */
  apple: {
    shape:"apple", shsize:540, shx:540, shy:930, shrot:0, hl:0.32, vol:0.8,
    cell:11, ang:45, dot:1.05, con:1.2, dshape:"circle", inv:false,
    txt:"bitmap\neffect", tsize:210, tlh:0.92, ty:330, tden:0.92, tgrad:false,
    sub:"BITMAP HALF TONES IN AI",
    bg:"#ff9ec7", ink:"#111111"
  },
  mono: {
    shape:"heart", shsize:600, shx:540, shy:900, shrot:-8, hl:0.3, vol:0.9,
    cell:14, ang:15, dot:1.1, con:1.5, dshape:"square", inv:false,
    txt:"NEW\nWAVE", tsize:230, tlh:0.88, ty:330, tden:1, tgrad:true,
    sub:"SIDE A — 1982",
    bg:"#eae6dd", ink:"#141414"
  },
  risoblue: {
    shape:"flower", shsize:620, shx:540, shy:920, shrot:12, hl:0.4, vol:0.6,
    cell:9, ang:30, dot:1.0, con:1.1, dshape:"diamond", inv:false,
    txt:"RISO\nPRINT", tsize:200, tlh:0.9, ty:320, tden:0.85, tgrad:true,
    sub:"DUOTONE / 2 LAYERS",
    bg:"#ffe9a8", ink:"#1436d6"
  }
};

const CTRL = {
  shape:"value", shsize:"n", shx:"n", shy:"n", shrot:"n", hl:"n", vol:"n",
  cell:"n", ang:"n", dot:"n", con:"n", dshape:"value", inv:"checked",
  txt:"value", tsize:"n", tlh:"n", ty:"n", tden:"n", tgrad:"checked", sub:"value",
  bg:"value", ink:"value"
};

const read = () => Object.fromEntries(Object.entries(CTRL).map(([k, kind]) => {
  const el = $(k);
  return [k, kind === "n" ? parseFloat(el.value) : kind === "checked" ? el.checked : el.value];
}));

function applyPreset(p){
  for (const [k, kind] of Object.entries(CTRL)){
    if (!(k in p)) continue;
    if (kind === "checked") $(k).checked = p[k]; else $(k).value = p[k];
  }
  render();
}

/* ---------------------------------------------------------------
   1단계 — 원본(그레이스케일)을 오프스크린 캔버스에 그린다.
   검정 = 점이 큼, 흰색 = 점 없음. 일러스트레이터에서 그라디언트를
   채운 뒤 비트맵 효과를 거는 것과 같은 순서다.
----------------------------------------------------------------*/
const src = document.createElement("canvas");
src.width = W; src.height = H;
const sctx = src.getContext("2d", { willReadFrequently: true });

function drawSource(s){
  sctx.fillStyle = "#fff";
  sctx.fillRect(0, 0, W, H);

  // --- 도형 ---
  const ops = SHAPES[s.shape] || [];
  if (ops.length){
    sctx.save();
    sctx.translate(s.shx, s.shy);
    sctx.rotate(s.shrot * Math.PI / 180);
    const k = s.shsize / 100;
    sctx.scale(k, k);
    sctx.translate(-50, -50);

    // 하이라이트가 있는 방사형 그라디언트 = 점 크기가 변하는 이유
    const gx = 50 + (s.hl - 0.5) * 60, gy = 18 + (1 - s.hl) * 24;
    const g = sctx.createRadialGradient(gx, gy, 2, 50, 55, 70);
    g.addColorStop(0, "#fff");
    g.addColorStop(Math.max(0.05, 0.45 - s.vol * 0.35), `rgb(${Math.round(255 - s.vol * 150)},${Math.round(255 - s.vol * 150)},${Math.round(255 - s.vol * 150)})`);
    g.addColorStop(1, "#000");
    sctx.fillStyle = g;
    sctx.strokeStyle = g;
    sctx.lineCap = "round";
    sctx.lineJoin = "round";
    for (const op of ops){
      const p = new Path2D(op.d);
      if (op.fill) sctx.fill(p);
      if (op.w){ sctx.lineWidth = op.w; sctx.stroke(p); }
    }
    sctx.restore();
  }

  // --- 글자 ---
  const lines = s.txt.split("\n").filter(Boolean);
  if (lines.length){
    sctx.save();
    sctx.textAlign = "center";
    sctx.textBaseline = "alphabetic";
    sctx.font = `900 ${s.tsize}px 'Helvetica Now Display','Archivo Black','Arial Black',Impact,'Liberation Sans',sans-serif`;
    if (s.tgrad){
      const g = sctx.createLinearGradient(0, s.ty - s.tsize, 0, s.ty + lines.length * s.tsize * s.tlh);
      g.addColorStop(0, "#fff");
      g.addColorStop(1, "#000");
      sctx.fillStyle = g;
    } else {
      const v = Math.round(255 * (1 - s.tden));
      sctx.fillStyle = `rgb(${v},${v},${v})`;
    }
    lines.forEach((line, i) =>
      sctx.fillText(line, W / 2, s.ty + i * s.tsize * s.tlh));
    sctx.restore();
  }
  return sctx.getImageData(0, 0, W, H).data;
}

/* ---------------------------------------------------------------
   2단계 — 회전된 격자를 훑으며 밝기를 읽어 점 반지름을 정한다.
   결과는 SVG path 하나. 즉 벡터라 무한 확대해도 깨지지 않는다.
----------------------------------------------------------------*/
function screenDots(px, s){
  const cell = s.cell;
  const a = s.ang * Math.PI / 180;
  const cos = Math.cos(a), sin = Math.sin(a);
  const reach = Math.ceil(Math.hypot(W, H) / 2 / cell) + 2;
  const cx = W / 2, cy = H / 2;
  const out = [];

  for (let v = -reach; v <= reach; v++){
    for (let u = -reach; u <= reach; u++){
      const x = cx + (u * cos - v * sin) * cell;
      const y = cy + (u * sin + v * cos) * cell;
      if (x < -cell || y < -cell || x > W + cell || y > H + cell) continue;

      const ix = Math.round(x), iy = Math.round(y);
      if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
      const o = (iy * W + ix) * 4;
      const lum = (px[o] * 0.299 + px[o + 1] * 0.587 + px[o + 2] * 0.114) / 255;

      let dark = s.inv ? lum : 1 - lum;
      dark = Math.min(1, Math.max(0, dark * s.con));
      if (dark < 0.02) continue;

      // 면적이 농도에 비례해야 눈에 자연스럽다 → 반지름은 sqrt
      const r = Math.sqrt(dark) * cell * 0.55 * s.dot;
      if (r < 0.25) continue;
      const X = x.toFixed(1), Y = y.toFixed(1), R = r.toFixed(2);

      if (s.dshape === "circle"){
        out.push(`M${(x - r).toFixed(1)} ${Y}a${R} ${R} 0 1 0 ${(r * 2).toFixed(2)} 0a${R} ${R} 0 1 0 ${(-r * 2).toFixed(2)} 0`);
      } else if (s.dshape === "square"){
        const d = (r * 1.6).toFixed(2);
        out.push(`M${(x - r * 0.8).toFixed(1)} ${(y - r * 0.8).toFixed(1)}h${d}v${d}h-${d}z`);
      } else {
        out.push(`M${X} ${(y - r).toFixed(1)}L${(x + r).toFixed(1)} ${Y}L${X} ${(y + r).toFixed(1)}L${(x - r).toFixed(1)} ${Y}z`);
      }
    }
  }
  return out.join("");
}

function buildCopy(s){
  const g = $("copy");
  g.textContent = "";
  if (!s.sub) return;
  const lines = s.txt.split("\n").filter(Boolean).length;
  const t = document.createElementNS(SVGNS, "text");
  t.setAttribute("x", W / 2);
  t.setAttribute("y", s.ty + Math.max(0, lines - 1) * s.tsize * s.tlh + 78);
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("font-size", 40);
  t.setAttribute("font-weight", 900);
  t.setAttribute("letter-spacing", 1);
  t.setAttribute("font-family", "'Archivo Black','Arial Black',Impact,'Liberation Sans',sans-serif");
  t.setAttribute("fill", s.ink);
  t.setAttribute("stroke", s.bg);
  t.setAttribute("stroke-width", 8);
  t.setAttribute("paint-order", "stroke fill");
  t.textContent = s.sub;
  g.appendChild(t);
}

function render(){
  const s = read();
  for (const k of Object.keys(CTRL))
    if (CTRL[k] === "n" && $(k + "O")) $(k + "O").value = s[k];

  const px = drawSource(s);
  $("dots").setAttribute("d", screenDots(px, s));
  $("dots").setAttribute("fill", s.ink);
  $("bgRect").setAttribute("fill", s.bg);
  buildCopy(s);
}

function serialize(){
  const svg = $("poster").cloneNode(true);
  svg.setAttribute("xmlns", SVGNS);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
}
const dataURL = () => "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(serialize())));
function download(href, name){ const a = document.createElement("a"); a.href = href; a.download = name; a.click(); }
$("png").onclick = () => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = W * 2; c.height = H * 2;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    download(c.toDataURL("image/png"), "halftone-bitmap.png");
  };
  img.onerror = () => alert("내보내기 실패");
  img.src = dataURL();
};
$("svgdl").onclick = () => download(dataURL(), "halftone-bitmap.svg");

document.querySelectorAll(".presets button").forEach(b =>
  b.onclick = () => applyPreset(PRESETS[b.dataset.preset]));
for (const key of Object.keys(CTRL)) $(key).addEventListener("input", render);
applyPreset(PRESETS.cherry);
</script>
