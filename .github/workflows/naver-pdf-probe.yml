name: PDF Route Probe

# Measures whether a PDF can be read without shipping pdf.js, which costs
# 1.5 MB and takes the Worker past what anyone can paste into the Cloudflare
# editor. Runs on a GitHub runner because the sandbox cannot reach Naver.

on:
  push:
    branches: ["claude/naver-content-mcp-server-9h9t07"]
    paths:
      - "apps/naver-mcp/scripts/probe_pdf.py"
      - ".github/workflows/naver-pdf-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: Read a real Korean PDF without pdf.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Probe both keyless routes
        working-directory: apps/naver-mcp
        run: python3 scripts/probe_pdf.py

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-probe
          path: apps/naver-mcp/pdf-probe.json
          if-no-files-found: warn
